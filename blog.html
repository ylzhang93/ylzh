<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>博客 · zyl</title>
<meta name="description" content="zyl 的数学博客：代数几何、模空间、数论的笔记与思考。可搜索、按标签筛选。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f7f5f0'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='42'%20text-anchor='middle'%20fill='%2323211c'%3Ez%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/i18n.js"></script>
<script src="assets/search.js"></script>
</head>

<body>

<nav aria-label="主导航">
  <a class="brand" href="index.html">zyl</a>
  <div class="nav-links">
    <a href="index.html#about" data-i18n="nav_about">关于</a>
    <a href="index.html#research" data-i18n="nav_research">研究</a>
    <a href="blog.html" class="active" data-i18n="nav_blog">博客</a>
    <a href="index.html#contact" data-i18n="nav_contact">联系</a>
    <button class="lang-btn" data-i18n-toggle type="button" aria-label="切换语言">EN</button>
  </div>
</nav>

<header class="page-head">
  <h1 data-i18n="blog_title">博客</h1>
  <p class="sub" data-i18n="blog_sub">用 Markdown 与 LaTeX 语法，记录数学的思考。</p>
  <a class="plus-btn" href="write.html?new=1">＋ <span data-i18n="plus_new">写日志</span></a>
</header>

<main>
  <div class="search-row">
    <input id="search" class="searchbox" type="search" autocomplete="off">
  </div>

  <div id="tagbar" class="tagbar" hidden></div>

  <p id="searching" class="empty" hidden data-i18n="searching">搜索中…</p>
  <ol id="post-list" class="post-list"></ol>
  <p id="empty" class="empty" data-i18n-html="blog_empty" hidden>
    还没有文章——写第一篇吧：<code>python new_post.py "文章标题"</code>
  </p>
  <p id="noresults" class="empty" hidden data-i18n="no_results">没有匹配的文章</p>
</main>

<footer>
  <p class="motto">For life, for math, for entertainment.</p>
  <p class="copy">© <span id="year">2026</span> zyl · <span data-i18n="footer_copy">纸与墨写就</span></p>
  <a class="write-link" href="write.html" data-i18n="write_link">写作</a>
</footer>

<script>
(function(){
  'use strict';
  document.getElementById('year').textContent = new Date().getFullYear();

  var posts = [];
  var mdCache = {};                    /* file -> 全文（首次搜索时按需加载） */
  var state = { q: '', tags: [] };     /* 当前搜索词 / 选中的标签 */
  var loading = false;

  var list = document.getElementById('post-list');
  var empty = document.getElementById('empty');
  var noresults = document.getElementById('noresults');
  var searching = document.getElementById('searching');
  var tagbar = document.getElementById('tagbar');
  var searchInput = document.getElementById('search');

  /* ---------- URL 参数：?q=…&tag=…（可分享的搜索结果） ---------- */
  function readParams(){
    var sp = new URLSearchParams(location.search);
    var q = sp.get('q');
    if (q) state.q = q.toLowerCase();
    state.tags = sp.getAll('tag');
  }
  function writeParams(){
    var sp = new URLSearchParams();
    if (state.q) sp.set('q', state.q);
    state.tags.forEach(function(t){ sp.append('tag', t); });
    var url = location.pathname + (sp.toString() ? '?' + sp.toString() : '');
    history.replaceState(null, '', url);
  }

  /* ---------- 标题按语言取 ---------- */
  function titleFor(p){
    return (I18N.lang === 'zh' ? p.title_zh : p.title_en) || p.title || '';
  }

  /* ---------- 过滤 + 渲染 ---------- */
  function matches(p){
    if (state.tags.length &&
        !state.tags.every(function(t){ return (p.tags || []).indexOf(t) !== -1; })){
      return false;
    }
    return window.Search.matchPost(p, mdCache[p.file] || null, state.q);
  }
  function matchedByContent(p){
    if (!state.q) return false;
    var c = mdCache[p.file];
    return !!c && c.toLowerCase().indexOf(state.q) !== -1;
  }

  function renderList(){
    list.innerHTML = '';
    var shown = posts.filter(matches);

    if (!posts.length){
      empty.hidden = false;
      noresults.hidden = true;
      return;
    }
    empty.hidden = true;
    if (!shown.length){
      noresults.hidden = false;
      return;
    }
    noresults.hidden = true;

    shown.forEach(function(p){
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = 'post.html?p=' + encodeURIComponent(p.file);

      var d = document.createElement('span');
      d.className = 'date';
      d.textContent = p.date;
      a.appendChild(d);

      var t = document.createElement('span');
      t.className = 'title';
      t.innerHTML = window.Search.highlight(titleFor(p), state.q);
      a.appendChild(t);

      if (Array.isArray(p.tags) && p.tags.length){
        var tg = document.createElement('span');
        tg.className = 'tags';
        p.tags.forEach(function(x){
          var s = document.createElement('span');
          s.className = 'tag';
          s.textContent = x;
          tg.appendChild(s);
        });
        a.appendChild(tg);
      }

      if (matchedByContent(p)){
        var sn = document.createElement('span');
        sn.className = 'snippet';
        sn.innerHTML = window.Search.highlight(
          window.Search.snippet(mdCache[p.file], state.q), state.q);
        a.appendChild(sn);
      }

      li.appendChild(a);
      list.appendChild(li);
    });
  }

  /* ---------- 全文按需加载（仅在有搜索词时） ---------- */
  function ensureContent(){
    if (!state.q) return;
    var need = posts.filter(function(p){ return !mdCache[p.file]; });
    if (!need.length) return;
    if (loading) return;
    loading = true;
    searching.hidden = false;
    Promise.all(need.map(function(p){
      return fetch(p.file).then(function(r){ return r.ok ? r.text() : ''; })
        .then(function(t){ mdCache[p.file] = t; })
        .catch(function(){ mdCache[p.file] = ''; });
    })).then(function(){
      loading = false;
      searching.hidden = true;
      renderList();
    });
  }

  /* ---------- 搜索框 ---------- */
  var timer = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      state.q = searchInput.value.trim().toLowerCase();
      writeParams();
      ensureContent();
      renderList();
    }, 250);
  });

  /* ---------- 标签栏 ---------- */
  function renderTagbar(){
    var tags = window.Search.distinctTags(posts);
    if (!tags.length){ tagbar.hidden = true; return; }
    tagbar.hidden = false;
    tagbar.innerHTML = '';

    var all = document.createElement('button');
    all.type = 'button';
    all.className = 'tag' + (state.tags.length === 0 ? ' active' : '');
    all.textContent = I18N.t('all_tags');
    all.addEventListener('click', function(){
      state.tags = [];
      writeParams(); renderTagbar(); renderList();
    });
    tagbar.appendChild(all);

    tags.forEach(function(t){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tag' + (state.tags.indexOf(t.tag) !== -1 ? ' active' : '');
      b.innerHTML = window.Search.highlight(t.tag, state.q) + '<span class="n">' + t.count + '</span>';
      b.addEventListener('click', function(){
        var i = state.tags.indexOf(t.tag);
        if (i === -1) state.tags.push(t.tag);
        else state.tags.splice(i, 1);
        writeParams(); renderTagbar(); renderList();
      });
      tagbar.appendChild(b);
    });
  }

  /* ---------- 语言切换 ---------- */
  window.onLangChange = function(){
    document.title = I18N.t('blog_title') + ' · zyl';
    searchInput.placeholder = I18N.t('search_ph');
    renderTagbar();
    renderList();
  };
  window.onLangChange(I18N.lang);

  /* ---------- 加载清单 ---------- */
  readParams();
  searchInput.value = state.q;
  fetch('posts/index.json')
    .then(function(r){ return r.ok ? r.json() : []; })
    .catch(function(){ return []; })
    .then(function(data){
      posts = Array.isArray(data) ? data : [];
      renderTagbar();
      ensureContent();
      renderList();
    });
})();
</script>
</body>
</html>
