<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>写作 · zyl</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f7f5f0'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='42'%20text-anchor='middle'%20fill='%2323211c'%3Ez%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/i18n.js"></script>
<script src="assets/config.js"></script>
<script src="assets/search.js"></script>
<script src="assets/gh.js"></script>
<script src="assets/libs.js"></script>
</head>

<body>

<nav aria-label="主导航">
  <a class="brand" href="index.html">zyl</a>
  <div class="nav-links">
    <a href="index.html#about" data-i18n="nav_about">关于</a>
    <a href="index.html#research" data-i18n="nav_research">研究</a>
    <a href="blog.html" data-i18n="nav_blog">博客</a>
    <a href="index.html#contact" data-i18n="nav_contact">联系</a>
    <button class="lang-btn" data-i18n-toggle type="button" aria-label="切换语言">EN</button>
  </div>
</nav>

<main class="write-wrap">
  <h1 class="sec" data-i18n="write_title" style="margin-top:6.5rem">写作</h1>

  <!-- 访客视角：404（没有令牌时显示） -->
  <div id="notfound" class="nf" hidden>
    <p class="nf-code">404</p>
    <p class="nf-text" data-i18n="notfound_text">页面不存在。</p>
    <a id="owner-entry" class="nf-link" href="#" data-i18n="owner_link">站长入口</a>
  </div>

  <!-- 口令门禁（仅站长，可选项） -->
  <div id="gate" class="gate" hidden>
    <p data-i18n="gate_prompt">此页面仅限站长使用，请输入口令。</p>
    <div class="row">
      <input id="gate-input" type="password" data-i18n-ph="gate_ph" placeholder="口令">
      <button id="gate-btn" class="btn" type="button" data-i18n="gate_unlock">解锁</button>
    </div>
    <p id="gate-err" class="err" hidden data-i18n="gate_wrong">口令错误，请重试。</p>
  </div>

  <!-- 编辑器 -->
  <div id="editor" class="editor-form" hidden>

    <div class="frow">
      <label data-i18n="f_existing">编辑已有文章</label>
      <select id="f-existing">
        <option value="" data-i18n="f_new">（新文章）</option>
      </select>
    </div>

    <div class="frow-inline">
      <div class="frow">
        <label data-i18n="f_title">标题</label>
        <input id="f-title" type="text">
      </div>
      <div class="frow">
        <label data-i18n="f_title_en">英文标题（可选）</label>
        <input id="f-title-en" type="text">
      </div>
    </div>

    <div class="frow">
      <label data-i18n="f_tags">标签（回车添加，可多个）</label>
      <input id="f-tags" type="text" list="tag-suggestions">
      <datalist id="tag-suggestions"></datalist>
      <div id="tag-chips" class="chips"></div>
    </div>

    <div class="frow">
      <label data-i18n="f_slug">文件名 slug</label>
      <input id="f-slug" type="text" placeholder="e.g. elliptic-curves">
      <p id="filename-hint" class="filename-hint">posts/….md</p>
    </div>

    <div class="frow">
      <label data-i18n="f_body">正文（Markdown + LaTeX）</label>
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="编辑工具">
        <button type="button" data-cmd="bold" data-tb="tb_bold" title="加粗"><b>B</b></button>
        <button type="button" data-cmd="italic" data-tb="tb_italic" title="斜体"><i>I</i></button>
        <button type="button" data-cmd="heading" data-tb="tb_heading" title="标题">H</button>
        <button type="button" data-cmd="list" data-tb="tb_list" title="列表">•</button>
        <span class="sep"></span>
        <button type="button" data-cmd="link" data-tb="tb_link" title="链接">🔗</button>
        <button type="button" data-cmd="image" data-tb="tb_image" title="图片">🖼</button>
        <button type="button" data-cmd="quote" data-tb="tb_quote" title="引用">❝</button>
        <button type="button" data-cmd="code" data-tb="tb_code" title="代码块">&lt;/&gt;</button>
        <span class="sep"></span>
        <button type="button" data-cmd="math" data-tb="tb_math" title="行内公式">$x$</button>
        <button type="button" data-cmd="mathblock" data-tb="tb_mathblock" title="块级公式">$$…$$</button>
        <button type="button" data-cmd="aopsmath" data-tb="tb_aopsmath" title="AoPS 公式">[math]</button>
        <button type="button" data-cmd="env" data-tb="tb_env" title="多行环境">env</button>
        <button type="button" data-cmd="spoiler" data-tb="tb_spoiler" data-i18n="tb_spoiler_lbl" title="隐藏解答（点击展开）">隐藏</button>
        <span class="sep"></span>
        <button type="button" data-cmd="mathfmt" data-tb="tb_mathfmt" title="数学字体与修饰">𝒜</button>
        <button type="button" data-cmd="thm" data-tb="tb_thm" title="定理环境" aria-expanded="false">∎</button>
        <button type="button" data-cmd="symbols" data-tb="tb_symbols" title="符号与表情" aria-expanded="false">☺</button>
      </div>
      <div id="symbol-panel" class="symbol-panel" hidden></div>
      <div id="fmt-panel" class="fmt-panel" hidden></div>
      <div id="thm-panel" class="fmt-panel" hidden></div>
      <textarea id="f-body" spellcheck="false"></textarea>
    </div>

    <div class="frow">
      <label data-i18n="token_lbl">GitHub Token</label>
      <input id="f-token" type="password" autocomplete="off">
      <p class="filename-hint" data-i18n="token_help">需要仓库 contents 读写权限</p>
      <p class="filename-hint"><a id="token-link" href="https://github.com/settings/tokens/new" target="_blank" rel="noopener" data-i18n="token_link">创建令牌 →</a></p>
    </div>

    <div class="actions">
      <button id="btn-preview" class="btn btn-ghost" type="button" data-i18n="btn_preview">预览</button>
      <button id="btn-save" class="btn" type="button" data-i18n="btn_save">保存发布</button>
      <button id="btn-delete" class="btn btn-danger" type="button" data-i18n="btn_delete" hidden>删除文章</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>
</main>

<footer>
  <p class="motto">For life, for math, for entertainment.</p>
  <p class="copy">© <span id="year">2026</span> zyl · <span data-i18n="footer_copy">纸与墨写就</span></p>
</footer>

<!-- 预览层：点「预览」按钮弹出 -->
<div id="preview-modal" class="preview-modal" hidden>
  <div class="preview-modal-bar">
    <span data-i18n="btn_preview">预览</span>
    <button id="preview-close" type="button" data-i18n-title="preview_close" title="关闭" aria-label="关闭">×</button>
  </div>
  <div class="preview-modal-body">
    <article id="preview-body" class="post"></article>
  </div>
</div>

<script>
(function(){
  'use strict';

  document.getElementById('year').textContent = new Date().getFullYear();
  var cfg = window.SITE_CONFIG;
  var TOKEN_KEY = 'zyl-token';
  var UNLOCK_KEY = 'zyl-unlocked';

  var $ = function(id){ return document.getElementById(id); };
  var gate = $('gate'), editor = $('editor');
  var editing = null;          /* {file, date} 编辑中的文章；null = 新文章 */
  var tags = [];
  var slugTouched = false;
  var token = '';

  /* 符号面板内容（默认隐藏，点工具栏 ☺ 展开；须在 openEditor 之前定义） */
  var SYMBOLS = [
    '∞','≠','≤','≥','±','×','÷','≈','∼','≡','∈','∉','⊂','⊆','∪','∩','∀','∃','∑','∏',
    '∫','∂','∇','√','π','θ','α','β','γ','δ','ε','λ','μ','σ','φ','ω','ℝ','ℂ','ℕ','ℤ','ℚ',
    '⊕','⊗','→','⇒','⇔','↦','·','∘','✓','✗','★','♥','☺',
    '😀','😄','😊','😉','🙂','😢','😮','🤔','👍','❤️','✨','🎉','📝','📚','🧮','⭐','🔥','✅','❌'
  ];

  /* 数学字体与修饰（WinEdt 式）：须在 openEditor 之前定义 */
  var FMT = [    { lbl: '𝒜', tex: '\\mathcal{',  ph: '字母' },
    { lbl: '𝔸', tex: '\\mathbb{',   ph: '字母' },
    { lbl: '𝐀', tex: '\\mathbf{',   ph: '字母' },
    { lbl: 'A', tex: '\\mathrm{',   ph: '字母' },
    { lbl: '𝔄', tex: '\\mathfrak{', ph: '字母' },
    { lbl: '𝒶', tex: '\\mathscr{',  ph: '字母' },
    { lbl: 'x̄', tex: '\\overline{',  ph: 'x' },
    { lbl: 'x̲', tex: '\\underline{', ph: 'x' },
    { lbl: 'x̂', tex: '\\hat{',       ph: 'x' },
    { lbl: 'x̃', tex: '\\tilde{',      ph: 'x' },
    { lbl: '√x', tex: '\\sqrt{',     ph: 'x' },
    { lbl: 'a⁄b', frac: true },
    { lbl: '▢', tex: '\\boxed{',    ph: 'x' },
    { lbl: 'x²', tex: '^{',          ph: '上标' },
    { lbl: 'x₂', tex: '_{',          ph: '下标' },
    { lbl: 'T', tex: '\\text{',     ph: '文本' }
  ];

  /* 定理环境类型（须在 openEditor 之前定义） */
  var THM_TYPES = ['theorem', 'lemma', 'proposition', 'corollary', 'definition',
                   'proof', 'remark', 'example', 'conjecture', 'claim'];

  /* ---------- 语言切换 ---------- */
  window.onLangChange = function(){
    document.title = I18N.t('write_title') + ' · zyl';
    var ph = { 'gate-input': 'gate_ph', 'f-token': 'token_ph' };
    Object.keys(ph).forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.placeholder = I18N.t(ph[id]);
    });
    document.querySelectorAll('[data-tb]').forEach(function(el){
      el.title = I18N.t(el.getAttribute('data-tb'));
    });
    var pc = document.getElementById('preview-close');
    if (pc) pc.title = I18N.t('preview_close');
  };
  window.onLangChange(I18N.lang);

  /* ---------- 门禁：无令牌显示 404，站长入口可进入 ---------- */
  function openEditor(){
    gate.hidden = true;
    $('notfound').hidden = true;
    editor.hidden = false;
    if (!cfg.owner || !cfg.repo){
      showMsg(I18N.t('cfg_missing'), 'err');
    }
    init();
  }
  function showNotFound(){
    $('notfound').hidden = false;
    gate.hidden = true;
    editor.hidden = true;
  }
  $('gate-btn').addEventListener('click', function(){
    if ($('gate-input').value === cfg.editorKey){
      try { localStorage.setItem(UNLOCK_KEY, '1'); } catch (e) {}
      openEditor();
    } else {
      $('gate-err').hidden = false;
    }
  });
  $('owner-entry').addEventListener('click', function(e){
    e.preventDefault();
    if (cfg.editorKey && localStorage.getItem(UNLOCK_KEY) !== '1'){
      gate.hidden = false;          /* 口令门禁（可选项） */
    } else {
      openEditor();
    }
  });
  var savedToken = '';
  try { savedToken = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  if (savedToken){
    openEditor();                   /* 站长：直接进编辑器 */
  } else {
    showNotFound();                 /* 访客：页面不存在（404） */
  }

  /* ---------- 消息 ---------- */
  function showMsg(html, type){
    var m = $('msg');
    m.className = 'msg ' + (type || 'ok');
    m.innerHTML = html;
  }

  /* ---------- 标签 ---------- */
  function renderChips(){
    var box = $('tag-chips');
    box.innerHTML = '';
    tags.forEach(function(t, i){
      var c = document.createElement('span');
      c.className = 'chip';
      c.textContent = t;
      c.title = '×';
      c.addEventListener('click', function(){ tags.splice(i, 1); renderChips(); });
      box.appendChild(c);
    });
  }
  $('f-tags').addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ','){
      e.preventDefault();
      var v = this.value.trim();
      if (v && tags.indexOf(v) === -1){ tags.push(v); renderChips(); }
      this.value = '';
    }
  });

  /* ---------- slug 自动生成 ---------- */
  $('f-title').addEventListener('input', function(){
    if (!slugTouched) $('f-slug').value = window.Search.slugify(this.value);
    updateFilename();
  });
  $('f-slug').addEventListener('input', function(){
    slugTouched = true;
    updateFilename();
  });
  function updateFilename(){
    var date = editing ? editing.date : new Date().toISOString().slice(0, 10);
    var slug = $('f-slug').value.trim() || 'post';
    $('filename-hint').textContent = 'posts/' + date + '-' + slug + '.md';
  }

  /* ---------- 工具栏：一键插入（AoPS 式） ---------- */
  function buildSymbolPanel(){
    var box = $('symbol-panel');
    SYMBOLS.forEach(function(ch){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = ch;
      b.addEventListener('click', function(){ insertAt(ch); closeSymbols(); });
      box.appendChild(b);
    });
  }
  /* 数学字体与修饰（WinEdt 式）：𝒜 面板 */
  function buildFmtPanel(){
    var box = $('fmt-panel');
    FMT.forEach(function(f){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = f.lbl;
      b.title = f.frac ? '\\frac{分子}{分母}' : f.tex + '…}';
      b.addEventListener('click', function(){
        if (f.frac) wrap('\\frac{', '}{分母}', '分子');
        else wrap(f.tex, '}', f.ph);
        closeFmt();
      });
      box.appendChild(b);
    });
  }
  function closeFmt(){
    var p = $('fmt-panel');
    p.hidden = true;
    var b = document.querySelector('[data-cmd="mathfmt"]');
    if (b) b.setAttribute('aria-expanded', 'false');
  }
  function closeThm(){
    var p = $('thm-panel');
    p.hidden = true;
    var b = document.querySelector('[data-cmd="thm"]');
    if (b) b.setAttribute('aria-expanded', 'false');
  }
  function buildThmPanel(){
    var box = $('thm-panel');
    THM_TYPES.forEach(function(type){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = type;
      b.title = '::: ' + type + ' 标题';
      b.addEventListener('click', function(){
        blockInsert(':::' + type + ' \n\n', '\n\n:::', '内容');
        closeThm();
      });
      box.appendChild(b);
    });
    /* 自定义宏：:::macros 块 */
    var mb = document.createElement('button');
    mb.type = 'button';
    mb.textContent = 'macros';
    mb.title = '::: macros 自定义宏（\\newcommand）';
    mb.addEventListener('click', function(){
      blockInsert(':::macros\n', '\n:::', '\\newcommand{\\RR}{\\mathbb{R}}');
      closeThm();
    });
    box.appendChild(mb);
  }
  function closeSymbols(){
    var p = $('symbol-panel');
    p.hidden = true;
    var b = document.querySelector('[data-cmd="symbols"]');
    if (b) b.setAttribute('aria-expanded', 'false');
  }
  $('toolbar').addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button[data-cmd]') : null;
    if (!btn) return;
    var cmd = btn.getAttribute('data-cmd');
    if (cmd === 'symbols'){
      var sp = $('symbol-panel');
      sp.hidden = !sp.hidden;
      btn.setAttribute('aria-expanded', String(!sp.hidden));
      closeFmt();
      closeThm();
      return;
    }
    if (cmd === 'mathfmt'){
      var fp = $('fmt-panel');
      fp.hidden = !fp.hidden;
      btn.setAttribute('aria-expanded', String(!fp.hidden));
      closeSymbols();
      closeThm();
      return;
    }
    if (cmd === 'thm'){
      var tp = $('thm-panel');
      tp.hidden = !tp.hidden;
      btn.setAttribute('aria-expanded', String(!tp.hidden));
      closeSymbols();
      closeFmt();
      return;
    }
    runCmd(cmd);
  });
  document.addEventListener('click', function(e){
    var inToolbar = e.target.closest && e.target.closest('#toolbar');
    var inSymbols = e.target.closest && e.target.closest('#symbol-panel');
    var inFmt = e.target.closest && e.target.closest('#fmt-panel');
    var inThm = e.target.closest && e.target.closest('#thm-panel');
    if (!inToolbar && !inSymbols) closeSymbols();
    if (!inToolbar && !inFmt) closeFmt();
    if (!inToolbar && !inThm) closeThm();
  });

  function ta(){ return $('f-body'); }

  /* 环绕选区插入：**text**、$text$、[math]text[/math] */
  function wrap(before, after, ph){
    var t = ta(), v = t.value, s = t.selectionStart, e = t.selectionEnd;
    var sel = v.slice(s, e) || ph || '';
    t.value = v.slice(0, s) + before + sel + after + v.slice(e);
    t.focus();
    t.setSelectionRange(s + before.length, s + before.length + sel.length);
  }
  /* 在光标处插入文本 */
  function insertAt(text, selFrom, selLen){
    var t = ta(), v = t.value, s = t.selectionStart, e = t.selectionEnd;
    t.value = v.slice(0, s) + text + v.slice(e);
    t.focus();
    var p = s + (selFrom === undefined ? text.length : selFrom);
    t.setSelectionRange(p, p + (selLen || 0));
  }
  /* 当前行加前缀：## 标题、- 列表、> 引用 */
  function prefixLine(prefix, ph){
    var t = ta(), v = t.value, s = t.selectionStart;
    var ls = v.lastIndexOf('\n', s - 1) + 1;
    var le = v.indexOf('\n', s); if (le === -1) le = v.length;
    var line = v.slice(ls, le);
    var add = prefix + (line.trim() ? '' : ph);
    t.value = v.slice(0, ls) + add + v.slice(ls);
    t.focus();
    t.setSelectionRange(ls + add.length, ls + add.length);
  }
  /* 块级插入：代码块 / 块级公式 */
  function blockInsert(before, after, ph){
    var t = ta(), v = t.value, s = t.selectionStart, e = t.selectionEnd;
    var sel = v.slice(s, e) || ph || '';
    var block = '\n' + before + sel + after + '\n';
    t.value = v.slice(0, s) + block + v.slice(e);
    t.focus();
    t.setSelectionRange(s + before.length + 1, s + before.length + 1 + sel.length);
  }

  function runCmd(cmd){
    switch (cmd){
      case 'bold':     wrap('**', '**', '粗体文字'); break;
      case 'italic':   wrap('*', '*', '斜体文字'); break;
      case 'heading':  prefixLine('## ', '标题'); break;
      case 'list':     prefixLine('- ', '列表项'); break;
      case 'quote':    prefixLine('> ', '引用内容'); break;
      case 'code':     blockInsert('```\n', '\n```', '代码'); break;
      case 'link':     wrap('[', '](https://)', '链接文字'); break;
      case 'image':    insertAt('![图片描述](https://example.com/image.png)', 2, 4); break;
      case 'math':     wrap('$', '$', 'x^2'); break;
      case 'mathblock':blockInsert('$$\n', '\n$$', '\\frac{a}{b}'); break;
      case 'aopsmath': wrap('[math]', '[/math]', 'x^2'); break;
      case 'env':      blockInsert('$$\n\\begin{align*}\n', '\n\\end{align*}\n$$',
                        'a &= b + c \\\\\n  &= d'); break;
      case 'spoiler':  blockInsert('<details>\n<summary>' + I18N.t('spoiler_summary') +
                        '</summary>\n\n', '\n\n</details>', I18N.t('spoiler_ph')); break;
    }
  }

  /* Tab 键插入空格（方便写代码） */
  $('f-body').addEventListener('keydown', function(e){
    if (e.key === 'Tab'){
      e.preventDefault();
      insertAt('    ');
    }
  });

  /* ---------- 预览（点「预览」按钮弹出预览层，不实时刷新） ---------- */
  function openPreview(){
    var body = $('f-body').value;
    var pv = $('preview-body');
    if (!body.trim()){ showMsg(I18N.t('need_body'), 'err'); return; }
    window.LIBS.load(function(ok){
      if (!ok){ showMsg(I18N.t('load_fail'), 'err'); return; }
      var res = window.LIBS.renderMarkdown(body, { lang: I18N.lang, macros: cfg.katexMacros || {} });
      pv.innerHTML = res.html;
      window.LIBS.renderMathIn(pv, res.macros);
      var modal = $('preview-modal');
      modal.hidden = false;
      document.body.style.overflow = 'hidden';   /* 锁定背景滚动 */
    });
  }
  function closePreview(){
    var modal = $('preview-modal');
    if (!modal || modal.hidden) return;
    modal.hidden = true;
    document.body.style.overflow = '';
  }
  $('btn-preview').addEventListener('click', openPreview);
  $('preview-close').addEventListener('click', closePreview);
  $('preview-modal').addEventListener('click', function(e){
    if (e.target === this) closePreview();   /* 点空白处关闭 */
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closePreview();
  });

  /* ---------- 已有文章列表 ---------- */
  var allPosts = [];
  function loadExistingList(done){
    fetch('posts/index.json', { cache: 'no-cache' })
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; })
      .then(function(posts){
        allPosts = Array.isArray(posts) ? posts : [];
        var sel = $('f-existing');
        allPosts.forEach(function(p){
          var o = document.createElement('option');
          o.value = p.file;
          o.textContent = (p.title_en || p.title || p.file) + '  ·  ' + p.date;
          sel.appendChild(o);
        });
        /* 标签建议 */
        var d = $('tag-suggestions');
        window.Search.distinctTags(allPosts).forEach(function(t){
          var o = document.createElement('option');
          o.value = t.tag;
          d.appendChild(o);
        });
        if (done) done();
      });
  }

  /* ---------- 新建 / 重置表单 ---------- */
  function resetForm(){
    editing = null;
    $('f-existing').value = '';
    $('f-title').value = '';
    $('f-title-en').value = '';
    $('f-body').value = '';
    $('f-slug').value = '';
    slugTouched = false;
    tags = [];
    renderChips();
    $('btn-delete').hidden = true;
    closePreview();
    $('preview-body').innerHTML = '';
    updateFilename();
  }

  $('f-existing').addEventListener('change', function(){
    var file = this.value;
    if (!file){
      resetForm();
      return;
    }
    fetch(file, { cache: 'no-cache' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(md){
      var p = null;
      allPosts.forEach(function(x){ if (x.file === file) p = x; });
      var m = file.match(/^posts\/(\d{4}-\d{2}-\d{2})-(.+)\.md$/);
      editing = { file: file, date: p ? p.date : (m ? m[1] : new Date().toISOString().slice(0,10)) };
      $('f-title').value = p ? (p.title || '') : '';
      $('f-title-en').value = p ? (p.title_en || '') : '';
      $('f-slug').value = m ? m[2] : '';
      slugTouched = true;
      tags = p && Array.isArray(p.tags) ? p.tags.slice() : [];
      renderChips();
      $('f-body').value = md;
      $('btn-delete').hidden = false;
      updateFilename();
      window.scrollTo(0, 0);
    });
  });

  /* ---------- 工具 ---------- */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function today(){ return new Date().toISOString().slice(0, 10); }
  function msgForCommit(what){
    return (what === 'del' ? 'delete' : (editing ? 'update' : 'add')) + ': ' +
           (editing ? editing.file : 'post');
  }

  /* ---------- 保存发布（GitHub Contents API，见 assets/gh.js） ---------- */
  $('btn-save').addEventListener('click', save);
  function save(){
    token = $('f-token').value.trim();
    if (!token){
      showMsg(I18N.t('need_token'), 'err');
      return;
    }
    var title = $('f-title').value.trim();
    var body = $('f-body').value;
    if (!title){ showMsg(I18N.t('need_title'), 'err'); return; }
    if (!body.trim()){ showMsg(I18N.t('need_body'), 'err'); return; }
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}

    var date = editing ? editing.date : today();
    var slug = $('f-slug').value.trim() || window.Search.slugify(title) || 'post';
    var file = 'posts/' + date + '-' + slug + '.md';

    showMsg('…', 'ok');

    (function saveLoop(baseFile, n){
      var path = n > 1 ? baseFile.replace(/\.md$/, '-' + n + '.md') : baseFile;
      window.GH.api('GET', path, cfg, token).then(function(res){
        if (!editing && res.ok){
          saveLoop(baseFile, n + 1);            /* 新文章重名 → 追加序号 */
          return;
        }
        var sha = res.ok ? res.j.sha : null;
        var mdBody = body.replace(/\n*$/, '') + '\n';
        window.GH.api('PUT', path, cfg, token, {
          message: msgForCommit('add'),
          content: window.GH.encodeB64(mdBody),
          sha: sha || undefined,
          branch: cfg.branch
        }).then(function(putRes){
          if (!putRes.ok){
            showMsg(I18N.t('save_fail') + ' ' + escapeHtml(putRes.j.message || ''), 'err');
            return;
          }
          updateIndex(path, function(ok2, msg){
            if (ok2){
              showMsg(I18N.t('saved_ok') + ' <a href="post.html?p=' + encodeURIComponent(path) +
                '" target="_blank">' + path + '</a>', 'ok');
              loadExistingList();   /* 刷新已有文章下拉框 */
            } else {
              showMsg(I18N.t('save_fail') + ' ' + msg, 'err');
            }
          });
        });
      });
    })(file, 1);
  }

  function updateIndex(path, done){
    window.GH.api('GET', 'posts/index.json', cfg, token).then(function(res){
      var posts = res.ok ? JSON.parse(window.GH.decodeB64(res.j.content)) : [];
      var entry = { file: path, title: $('f-title').value.trim(), date: (editing ? editing.date : today()) };
      var te = $('f-title-en').value.trim();
      if (te) entry.title_en = te;
      entry.tags = tags.slice();

      posts = posts.filter(function(p){ return p.file !== path; });
      posts.push(entry);
      posts.sort(function(a, b){ return (a.date < b.date) ? 1 : (a.date > b.date ? -1 : 0); });

      window.GH.api('PUT', 'posts/index.json', cfg, token, {
        message: 'update posts/index.json',
        content: window.GH.encodeB64(JSON.stringify(posts, null, 2) + '\n'),
        sha: res.ok ? res.j.sha : null,
        branch: cfg.branch
      }).then(function(r){
        if (r.ok){
          editing = { file: path, date: entry.date };
          done(true, '');
        } else {
          done(false, escapeHtml(r.j.message || ''));
        }
      });
    });
  }

  /* ---------- 删除文章 ---------- */
  $('btn-delete').addEventListener('click', function(){
    if (!editing) return;
    token = $('f-token').value.trim();
    if (!token){ showMsg(I18N.t('need_token'), 'err'); return; }
    if (!window.confirm(I18N.t('del_confirm'))) return;

    window.GH.deletePost(cfg, token, editing.file, function(ok, msg){
      if (!ok){
        showMsg(I18N.t('save_fail') + ' ' + escapeHtml(msg || ''), 'err');
        return;
      }
      showMsg(I18N.t('del_ok'), 'ok');
      resetForm();
      loadExistingList();
    });
  });

  /* ---------- 初始化 ---------- */
  function init(){
    try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
    if (token) $('f-token').value = token;
    buildSymbolPanel();
    buildFmtPanel();
    buildThmPanel();
    updateFilename();
    var sp = new URLSearchParams(location.search);
    if (sp.get('new') === '1'){
      resetForm();              /* 博客页 ＋ 按钮：直接开始新文章 */
      $('f-title').focus();
    } else {
      var target = sp.get('p');
      if (target){
        /* 博客列表"编辑"按钮：直接载入指定文章 */
        loadExistingList(function(){
          var sel = $('f-existing');
          for (var i = 0; i < sel.options.length; i++){
            if (sel.options[i].value === target){
              sel.value = target;
              sel.dispatchEvent(new Event('change'));
              return;
            }
          }
        });
      } else {
        loadExistingList();
        $('f-existing').dispatchEvent(new Event('change'));
      }
    }
  }
})();
</script>
</body>
