<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>私有空间 · zyl</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f7f5f0'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='42'%20text-anchor='middle'%20fill='%2323211c'%3Ez%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/i18n.js"></script>
<script src="assets/config.js"></script>
<script src="assets/search.js"></script>
<script src="assets/gh.js"></script>
<script src="assets/libs.js"></script>
</head>

<body>

<nav aria-label="主导航">
  <a class="brand" href="index.html">zyl</a>
  <div class="nav-links">
    <a href="index.html#about" data-i18n="nav_about">关于</a>
    <a href="index.html#research" data-i18n="nav_research">研究</a>
    <a href="blog.html" data-i18n="nav_blog">博客</a>
    <a href="index.html#contact" data-i18n="nav_contact">联系</a>
    <button class="lang-btn" data-i18n-toggle type="button" aria-label="切换语言">EN</button>
  </div>
</nav>

<main class="post-wrap">
  <h1 class="sec" data-i18n="private_title" style="margin-top:6.5rem">私有空间</h1>

  <!-- 无令牌 → 404 -->
  <div id="notfound" class="nf" hidden>
    <p class="nf-code">404</p>
    <p class="nf-text" data-i18n="private_404">此页面需要令牌访问。</p>
    <a id="owner-entry" class="nf-link" href="#" data-i18n="owner_link">站长入口</a>
    <div id="priv-token-row" class="gate" style="margin-top:2rem;text-align:left" hidden>
      <div class="frow">
        <label data-i18n="token_lbl">GitHub Token</label>
        <input id="priv-token" type="password" autocomplete="off">
        <label class="remember">
          <input id="priv-remember" type="checkbox">
          <span data-i18n="remember_lbl">在这台电脑上记住令牌</span>
        </label>
      </div>
      <button id="priv-enter" class="btn" type="button" data-i18n="private_enter">进入</button>
    </div>
  </div>

  <!-- 私有笔记 -->
  <div id="private-area" hidden>
    <div class="search-row">
      <input id="priv-search" class="searchbox" type="search" autocomplete="off">
    </div>
    <p id="priv-count" class="count" style="margin-bottom:1.2rem"></p>
    <ol id="priv-list" class="post-list"></ol>
    <p id="priv-empty" class="empty" data-i18n="private_empty">暂无私有笔记。</p>
    <p id="priv-noconfig" class="empty" data-i18n="private_noconfig" hidden></p>
    <article id="priv-reader" class="post" hidden></article>
  </div>
</main>

<footer>
  <p class="motto">For life, for math, for entertainment.</p>
  <p class="copy">© <span id="year">2026</span> zyl · <span data-i18n="footer_copy">纸与墨写就</span></p>
  <a class="write-link" href="write.html" data-i18n="write_link">写作</a>
  <span class="write-link" style="margin-left:1rem">·</span>
  <a class="write-link" href="private.html" data-i18n="private_link">私有</a>
</footer>

<script>
(function(){
  'use strict';

  document.getElementById('year').textContent = new Date().getFullYear();
  var cfg = window.SITE_CONFIG || {};
  var TOKEN_KEY = 'zyl-token';
  var token = '';
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}

  var $ = function(id){ return document.getElementById(id); };
  var notes = [];          /* 私有笔记清单 */
  var contentCache = {};   /* file -> 正文 */
  var state = { q: '' };

  /* ---------- 语言切换 ---------- */
  window.onLangChange = function(){
    document.title = I18N.t('private_title') + ' · zyl';
    $('priv-search').placeholder = I18N.t('search_ph');
    if (!token) return;
    renderList();
  };
  window.onLangChange(I18N.lang);

  /* ---------- 门禁：无令牌 → 404 ---------- */
  function showNotFound(){
    $('notfound').hidden = false;
    $('private-area').hidden = true;
  }
  function enter(){
    token = $('priv-token').value.trim();
    if (!token) return;
    if ($('priv-remember').checked){
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    }
    $('notfound').hidden = true;
    $('priv-token-row').hidden = true;
    $('private-area').hidden = false;
    loadNotes();
  }
  $('owner-entry').addEventListener('click', function(e){
    e.preventDefault();
    $('priv-token-row').hidden = !$('priv-token-row').hidden;
  });
  $('priv-enter').addEventListener('click', enter);
  $('priv-token').addEventListener('keydown', function(e){
    if (e.key === 'Enter') enter();
  });

  if (token){
    $('private-area').hidden = false;
    loadNotes();
  } else {
    showNotFound();
  }

  /* ---------- 私有仓库配置 ---------- */
  function privCfg(){
    return { owner: cfg.owner, repo: cfg.privateRepo || '', branch: cfg.branch || 'main' };
  }

  /* ---------- 加载清单 ---------- */
  function loadNotes(){
    if (!cfg.privateRepo){
      $('priv-noconfig').hidden = false;
      return;
    }
    window.GH.api('GET', 'posts/index.json', privCfg(), token)
      .then(function(res){
        if (!res.ok){ renderList(); return; }
        try {
          notes = JSON.parse(window.GH.decodeB64(res.j.content).replace(/^\uFEFF/, ''));
        } catch (e) { notes = []; }
        renderList();
      });
  }

  /* ---------- 渲染列表 ---------- */
  function titleFor(p){
    return (I18N.lang === 'zh' ? p.title_zh : p.title_en) || p.title || '';
  }
  function renderList(){
    var list = $('priv-list');
    list.innerHTML = '';
    $('priv-reader').hidden = true;

    var shown = notes.filter(function(p){
      if (!state.q) return true;
      var c = contentCache[p.file];
      return window.Search.matchPost(p, c || null, state.q);
    });

    $('priv-count').textContent = I18N.t('post_count').replace('{n}', notes.length);
    if (!shown.length){
      $('priv-empty').hidden = false;
      return;
    }
    $('priv-empty').hidden = true;

    shown.forEach(function(p){
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#';
      var t = document.createElement('span');
      t.className = 'title';
      t.textContent = titleFor(p);
      a.appendChild(t);
      if (Array.isArray(p.tags) && p.tags.length){
        var tg = document.createElement('span');
        tg.className = 'tags';
        p.tags.forEach(function(x){
          var s = document.createElement('span');
          s.className = 'tag';
          s.textContent = x;
          tg.appendChild(s);
        });
        a.appendChild(tg);
      }
      var d = document.createElement('span');
      d.className = 'date';
      d.textContent = window.Search.formatDate(p.date, I18N.lang);
      a.appendChild(d);
      a.addEventListener('click', function(e){
        e.preventDefault();
        openNote(p);
      });
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  /* ---------- 打开笔记 ---------- */
  function openNote(p){
    if (contentCache[p.file]){
      renderNote(p, contentCache[p.file]);
      return;
    }
    window.GH.api('GET', p.file, privCfg(), token).then(function(res){
      if (!res.ok) return;
      var md = window.GH.decodeB64(res.j.content);
      contentCache[p.file] = md;
      renderNote(p, md);
    });
  }
  function renderNote(p, md){
    var reader = $('priv-reader');
    var list = $('priv-list');
    reader.hidden = false;
    list.innerHTML = '';
    $('priv-count').hidden = true;

    /* 去掉正文开头的 # 标题（与 post.html 一致） */
    md = md.replace(/^#\s+.*$/m, '').replace(/^\n+/, '');

    window.LIBS.load(function(ok){
      if (!ok){
        reader.innerHTML = '<p class="empty">' + I18N.t('load_fail') + '</p>';
        return;
      }
      var res = window.LIBS.renderMarkdown(md, { lang: I18N.lang, macros: cfg.katexMacros || {} });
      var tags = Array.isArray(p.tags) ? p.tags : [];
      var meta = '<header class="post-meta"><span>' + window.Search.formatDate(p.date, I18N.lang) + '</span>' +
        tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('') + '</header>';
      reader.innerHTML =
        '<a class="back" href="#" id="priv-back">← ' + I18N.t('private_back') + '</a>' +
        '<h1>' + (p.title || '') + '</h1>' + meta + res.html;
      window.LIBS.renderMathIn(reader, res.macros);
      document.getElementById('priv-back').addEventListener('click', function(e){
        e.preventDefault();
        reader.hidden = true;
        $('priv-count').hidden = false;
        renderList();
      });
      window.scrollTo(0, 0);
    });
  }

  /* ---------- 搜索（标题/标签即时 + 正文按需） ---------- */
  var timer = null;
  $('priv-search').addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      state.q = $('priv-search').value.trim().toLowerCase();
      if (state.q){
        /* 按需拉取未缓存正文 */
        var need = notes.filter(function(p){ return !contentCache[p.file]; });
        if (need.length){
          Promise.all(need.map(function(p){
            return window.GH.api('GET', p.file, privCfg(), token).then(function(res){
              if (res.ok) contentCache[p.file] = window.GH.decodeB64(res.j.content);
            });
          })).then(renderList);
          return;
        }
      }
      renderList();
    }, 250);
  });

  /* 页脚入口仅站长可见 */
  try {
    if (!localStorage.getItem(TOKEN_KEY)){
      var wl = document.querySelectorAll('.write-link');
      for (var i = 0; i < wl.length; i++) wl[i].style.display = 'none';
    }
  } catch (e) {}
})();
</script>
</body>
</html>
