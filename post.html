<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>文章 · zyl</title>
<meta name="description" content="zyl 的数学博客文章。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f7f5f0'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='42'%20text-anchor='middle'%20fill='%2323211c'%3Ez%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/i18n.js"></script>
</head>

<body>

<nav aria-label="主导航">
  <a class="brand" href="index.html">zyl</a>
  <div class="nav-links">
    <a href="index.html#about" data-i18n="nav_about">关于</a>
    <a href="index.html#research" data-i18n="nav_research">研究</a>
    <a href="blog.html" class="active" data-i18n="nav_blog">博客</a>
    <a href="index.html#contact" data-i18n="nav_contact">联系</a>
    <button class="lang-btn" data-i18n-toggle type="button" aria-label="切换语言">EN</button>
  </div>
</nav>

<main class="post-wrap">
  <a class="back" href="blog.html" data-i18n="back_blog">← 返回博客</a>
  <article id="post" class="post">
    <p class="empty" data-i18n="loading">正在加载…</p>
  </article>
  <nav id="post-nav" class="post-nav" aria-label="上一篇下一篇"></nav>
</main>

<footer>
  <p class="motto">For life, for math, for entertainment.</p>
  <p class="copy">© <span id="year">2026</span> zyl · <span data-i18n="footer_copy">纸与墨写就</span></p>
</footer>

<script>
(function(){
  'use strict';

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ========== 多 CDN 加载（jsdelivr → npmmirror → unpkg） ========== */
  function loadScript(urls, done){
    var i = 0;
    (function next(){
      if (i >= urls.length) return done(false);
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function(){ done(true); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  }
  function loadCss(src){
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = src;
    document.head.appendChild(l);
  }

  var JSD   = function(path){ return 'https://cdn.jsdelivr.net/npm/' + path; };
  var NPMM  = function(path){ return 'https://registry.npmmirror.com/' + path; };
  var UNPKG = function(path){ return 'https://unpkg.com/' + path; };
  function chain(path){
    return [JSD(path), NPMM(path), UNPKG(path)];
  }

  /* 库加载顺序：marked → dompurify → katex + auto-render → 渲染文章 */
  loadScript(chain('marked@5.1.2/marked.min.js'), function(ok){
    if (!ok) return fail();
    loadScript(chain('dompurify@3.1.6/dist/purify.min.js'), function(ok2){
      if (!ok2) return fail();
      loadScript(chain('katex@0.16.11/dist/katex.min.js'), function(ok3){
        if (!ok3) return fail();
        loadCss('https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css');
        loadScript(chain('katex@0.16.11/dist/contrib/auto-render.min.js'), function(ok4){
          if (!ok4) return fail();
          renderPost();
        });
      });
    });
  });

  function fail(){
    document.getElementById('post').innerHTML =
      '<p class="empty">' + I18N.t('load_fail') + '</p>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var state = { posts: [], file: null, entry: null };

  /* 标题按语言取：title_zh / title_en，缺省回退到 title */
  function titleFor(p){
    return (I18N.lang === 'zh' ? p.title_zh : p.title_en) || p.title || '';
  }

  /* 语言切换时更新：页面标题 + 上一篇/下一篇 */
  window.onLangChange = function(){
    if (!state.file) return;
    var entry = state.entry;
    var title = entry ? titleFor(entry)
                      : ((state.md || '').match(/^#\s+(.+)$/m) || ['', I18N.t('no_post')])[1].trim();
    document.title = title + ' · zyl';

    var navEl = document.getElementById('post-nav');
    var idx = state.posts.indexOf(entry);
    if (idx > -1){
      var next = state.posts[idx - 1];   /* 更新的 */
      var prev = state.posts[idx + 1];   /* 更旧的 */
      var left = prev
        ? '<a href="post.html?p=' + encodeURIComponent(prev.file) + '">' +
            '<span class="dir">← ' + I18N.t('prev_dir') + '</span>' + escapeHtml(titleFor(prev)) + '</a>'
        : '<span></span>';
      var right = next
        ? '<a class="next" href="post.html?p=' + encodeURIComponent(next.file) + '">' +
            '<span class="dir">' + I18N.t('next_dir') + ' →</span>' + escapeHtml(titleFor(next)) + '</a>'
        : '<span></span>';
      navEl.innerHTML = left + right;
    }
  };

  function renderPost(){
    var params = new URLSearchParams(location.search);
    var file = params.get('p');
    var article = document.getElementById('post');

    if (!file){
      article.innerHTML = '<p class="empty">' + I18N.t('no_post') + '</p>';
      return;
    }

    Promise.all([
      /* 文章清单：标题 / 日期 / 标签 / 上一篇下一篇 */
      fetch('posts/index.json')
        .then(function(r){ return r.ok ? r.json() : []; })
        .catch(function(){ return []; }),
      /* 文章正文 */
      fetch(file).then(function(r){
        if (!r.ok) throw new Error('not found');
        return r.text();
      })
    ]).then(function(res){
      state.posts = Array.isArray(res[0]) ? res[0] : [];
      state.file = file;
      state.md = res[1];
      state.entry = null;
      state.posts.forEach(function(x){ if (x && x.file === file) state.entry = x; });
      var md = res[1];

      /* 数学保护：围栏代码块原样保留，其余部分先转换 [math] 标签，
         再把数学片段换成占位符，避免 Markdown 引擎误解析公式里的 _ * 等字符 */
      var mathSpans = [];
      function protectSeg(seg){
        seg = seg.replace(/\[math\]\s*([\s\S]*?)\s*\[\/math\]/g, function(_, inner){
          return /\n/.test(inner)
            ? '\n$$\n' + inner.trim() + '\n$$\n'
            : '$' + inner.trim() + '$';
        });
        function p(re){
          seg = seg.replace(re, function(m){
            mathSpans.push(m);
            return '\u27E6' + (mathSpans.length - 1) + '\u27E7';
          });
        }
        p(/\$\$[\s\S]+?\$\$/g);       /* 块级 $$...$$ */
        p(/\$[^$\n]+?\$/g);           /* 行内 $...$ */
        p(/\\\[[\s\S]+?\\\]/g);       /* \[...\] */
        p(/\\\([\s\S]+?\\\)/g);       /* \(...\) */
        return seg;
      }
      md = md.split(/(```[^\n]*\n[\s\S]*?```)/g)
            .map(function(seg, i){ return i % 2 === 1 ? seg : protectSeg(seg); })
            .join('');

      var html = window.marked.parse ? window.marked.parse(md) : window.marked(md);
      /* 还原公式并做 HTML 转义：& < > 由浏览器解码，KaTeX 从文本节点读回原字符 */
      html = html.replace(/\u27E6(\d+)\u27E7/g, function(_, i){
        return escapeHtml(mathSpans[+i]);
      });
      var clean = window.DOMPurify.sanitize(html);

      var title = state.entry ? titleFor(state.entry) : ((md.match(/^#\s+(.+)$/m) || [,''])[1] || '').trim();
      var date  = state.entry ? state.entry.date : ((file.match(/^posts\/(\d{4}-\d{2}-\d{2})/) || [,''])[1]);
      var tags  = state.entry && Array.isArray(state.entry.tags) ? state.entry.tags : [];

      var meta = '<header class="post-meta"><span>' + escapeHtml(date) + '</span>' +
        tags.map(function(t){ return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') +
        '</header>';

      article.innerHTML = '<h1>' + escapeHtml(title) + '</h1>' + meta + clean;

      window.onLangChange();   /* 页面标题 + 上一篇/下一篇 */

      /* KaTeX 渲染公式 */
      if (window.renderMathInElement){
        renderMathInElement(article, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });
      }
      window.scrollTo(0, 0);
    }).catch(function(){
      article.innerHTML =
        '<p class="empty">' + I18N.t('post_missing') + escapeHtml(file) + '</p>';
    });
  }
})();
</script>
</body>
</html>
