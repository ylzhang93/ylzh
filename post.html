<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>文章 · zyl</title>
<meta name="description" content="zyl 的数学博客文章。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f7f5f0'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='42'%20text-anchor='middle'%20fill='%2323211c'%3Ez%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/i18n.js"></script>
<script src="assets/config.js"></script>
<script src="assets/libs.js"></script>
</head>

<body>

<nav aria-label="主导航">
  <a class="brand" href="index.html">zyl</a>
  <div class="nav-links">
    <a href="index.html#about" data-i18n="nav_about">关于</a>
    <a href="index.html#research" data-i18n="nav_research">研究</a>
    <a href="blog.html" class="active" data-i18n="nav_blog">博客</a>
    <a href="index.html#contact" data-i18n="nav_contact">联系</a>
    <button class="lang-btn" data-i18n-toggle type="button" aria-label="切换语言">EN</button>
  </div>
</nav>

<main class="post-wrap">
  <a class="back" href="blog.html" data-i18n="back_blog">← 返回博客</a>
  <article id="post" class="post">
    <p class="empty" data-i18n="loading">正在加载…</p>
  </article>
  <section id="comments" class="comments-section" hidden>
    <h2 class="sec" data-i18n="comments_title">评论</h2>
    <p class="comments-note" data-i18n="comments_note">回复需要 GitHub 账号，登录后即可跟帖。</p>
    <div id="comments-box"></div>
  </section>
  <nav id="post-nav" class="post-nav" aria-label="上一篇下一篇"></nav>
</main>

<footer>
  <p class="motto">For life, for math, for entertainment.</p>
  <p class="copy">© <span id="year">2026</span> zyl · <span data-i18n="footer_copy">纸与墨写就</span></p>
  <a class="write-link" href="write.html" data-i18n="write_link">写作</a>
</footer>

<script>
(function(){
  'use strict';

  document.getElementById('year').textContent = new Date().getFullYear();

  /* 页脚写作入口仅站长可见 */
  try {
    if (!localStorage.getItem('zyl-token')){
      var wl = document.querySelector('.write-link');
      if (wl) wl.style.display = 'none';
    }
  } catch (e) {}

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var state = { posts: [], file: null, entry: null, md: '' };
  var cfg = window.SITE_CONFIG || {};
  var commentsLoaded = false;

  /* 标题按语言取：title_zh / title_en，缺省回退到 title */
  function titleFor(p){
    return (I18N.lang === 'zh' ? p.title_zh : p.title_en) || p.title || '';
  }

  /* 评论区：一篇一个 Discussion（term = 文章路径） */
  function refreshComments(){
    var sec = document.getElementById('comments');
    var ok = window.LIBS.loadComments(cfg, state.file, I18N.lang, document.getElementById('comments-box'));
    sec.hidden = !ok;
    commentsLoaded = ok;
  }

  /* 语言切换时更新：页面标题 + 上一篇/下一篇 + 评论区语言 */
  window.onLangChange = function(){
    if (!state.file) return;
    var entry = state.entry;
    var title = entry ? titleFor(entry)
                      : ((state.md.match(/^#\s+(.+)$/m) || ['', I18N.t('no_post')])[1]).trim();
    document.title = title + ' · zyl';

    var navEl = document.getElementById('post-nav');
    var idx = state.posts.indexOf(entry);
    if (idx > -1){
      var next = state.posts[idx - 1];   /* 更新的 */
      var prev = state.posts[idx + 1];   /* 更旧的 */
      var left = prev
        ? '<a href="post.html?p=' + encodeURIComponent(prev.file) + '">' +
            '<span class="dir">← ' + I18N.t('prev_dir') + '</span>' + escapeHtml(titleFor(prev)) + '</a>'
        : '<span></span>';
      var right = next
        ? '<a class="next" href="post.html?p=' + encodeURIComponent(next.file) + '">' +
            '<span class="dir">' + I18N.t('next_dir') + ' →</span>' + escapeHtml(titleFor(next)) + '</a>'
        : '<span></span>';
      navEl.innerHTML = left + right;
    }
    if (commentsLoaded) refreshComments();   /* 评论界面语言跟随切换 */
  };

  function renderPost(){
    var params = new URLSearchParams(location.search);
    var file = params.get('p');
    var article = document.getElementById('post');

    if (!file){
      article.innerHTML = '<p class="empty">' + I18N.t('no_post') + '</p>';
      return;
    }

    window.LIBS.load(function(ok){
      if (!ok){
        article.innerHTML = '<p class="empty">' + I18N.t('load_fail') + '</p>';
        return;
      }
      loadAndRender();
    });

    function loadAndRender(){
      Promise.all([
        fetch('posts/index.json')
          .then(function(r){ return r.ok ? r.json() : []; })
          .catch(function(){ return []; }),
        fetch(file).then(function(r){
          if (!r.ok) throw new Error('not found');
          return r.text();
        })
      ]).then(function(res){
        state.posts = Array.isArray(res[0]) ? res[0] : [];
        state.file = file;
        state.md = res[1];
        state.entry = null;
        state.posts.forEach(function(x){ if (x && x.file === file) state.entry = x; });

        var md = res[1];
        /* 清单里有标题时，去掉正文开头重复的 # 标题（避免双标题） */
        if (state.entry) md = md.replace(/^#\s+.*$/m, '').replace(/^\n+/, '');

        var html = window.LIBS.renderMarkdown(md);
        var title = state.entry ? titleFor(state.entry)
                                : ((md.match(/^#\s+(.+)$/m) || [,''])[1] || '').trim();
        var date  = state.entry ? state.entry.date : ((file.match(/^posts\/(\d{4}-\d{2}-\d{2})/) || [,''])[1]);
        var tags  = state.entry && Array.isArray(state.entry.tags) ? state.entry.tags : [];

        var meta = '<header class="post-meta"><span>' + escapeHtml(date) + '</span>' +
          tags.map(function(t){
            return '<a class="tag" href="blog.html?tag=' + encodeURIComponent(t) + '">' +
              escapeHtml(t) + '</a>';
          }).join('') +
          '</header>';

        article.innerHTML = '<h1>' + escapeHtml(title) + '</h1>' + meta + html;

        window.onLangChange();   /* 页面标题 + 上一篇/下一篇 */

        window.LIBS.renderMathIn(article);
        refreshComments();       /* 评论区（配置了就显示） */
        window.scrollTo(0, 0);
      }).catch(function(){
        article.innerHTML =
          '<p class="empty">' + I18N.t('post_missing') + escapeHtml(file) + '</p>';
      });
    }
  }

  renderPost();
})();
</script>
</body>
</html>
